name: Import cinema screenings (60 days)
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test parsing without publishing'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: kidscity-cinema-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'beautifulsoup4==4.12.3'
      - name: Import verified cinema screenings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CINEMA_LOOKAHEAD_DAYS: '60'
          CINEMA_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/import_cinema.py
