    <circle cx="360" cy="310" r="183" fill="url(#face)" stroke="#b99b69" stroke-width="2"/>
    <circle cx="360" cy="310" r="166" fill="none" stroke="#e8dcc7" stroke-width="1.5"/>
    <circle cx="360" cy="310" r="151" fill="none" stroke="#d9cbb6" stroke-width="1"/>
    <g stroke="#b9a98f" stroke-width="2" stroke-linecap="round">
      <path d="M360 151v15 M360 454v15 M201 310h15 M504 310h15"/>
      <path d="M247 197l11 11 M462 412l11 11 M473 197l-11 11 M258 412l-11 11" opacity=".8"/>
    </g>
    <g fill="#a99b87" font-family="Georgia,serif" font-size="17" text-anchor="middle">
      <text x="360" y="140">N</text><text x="360" y="493">S</text><text x="188" y="316">W</text><text x="532" y="316">E</text>
    </g>
    <g transform="translate(360 310)">
