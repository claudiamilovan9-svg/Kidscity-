<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Busolă elegantă în nuanțe pastelate</title>
  <desc id="desc">O busolă delicată, cu cadran crem, margini aurii și accente pastelate de lavandă, roz și mentă.</desc>
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#f6eefa" stop-opacity=".9"/><stop offset="1" stop-color="#f6eefa" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4d9"/><stop offset=".45" stop-color="#c9a96e"/><stop offset="1" stop-color="#fff0cc"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f5f0e8"/></linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9a7c7"/><stop offset="1" stop-color="#9d91c7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#9a8ba8" flood-opacity=".18"/></filter>
  </defs>
  <ellipse cx="360" cy="320" rx="300" ry="270" fill="url(#halo)"/>
  <circle cx="360" cy="310" r="224" fill="#d8cce8" opacity=".16"/>
